# V4 Multimodal RCA Model Configuration
# Architecture: Depthwise Separable TCN + Gated Fusion + Cross-Service Attention + PCMCI
# This is the actual configuration used in production

model:
  name: "MultimodalRCAModel_V4"
  description: "Lightweight multimodal RCA with TCN encoders and causal attention"
  
  # Model size configurations
  configs:
    small:
      embed_dim: 128
      hidden_dim: 32
      parameters: "~324K"
    large:
      embed_dim: 192
      hidden_dim: 48
      parameters: "~722K"
  
  # Modality Encoders (all use Depthwise Separable TCN)
  metrics_encoder:
    type: "depthwise_separable_tcn"
    n_features: 64
    hidden_dim: "${model.configs.large.hidden_dim}"  # 48
    embed_dim: "${model.configs.large.embed_dim}"    # 192
    num_layers: 2
    kernel_size: 3
    dilation: [1, 2]  # Exponential dilation
    dropout: 0.35
  
  logs_encoder:
    type: "depthwise_separable_tcn"
    n_features: 32  # Log template counts
    hidden_dim: "${model.configs.large.hidden_dim}"
    embed_dim: "${model.configs.large.embed_dim}"
    num_layers: 2
    kernel_size: 3
    dilation: [1, 2]
    dropout: 0.35
  
  traces_encoder:
    type: "depthwise_separable_tcn"
    n_features: 32  # Latency + error features
    hidden_dim: "${model.configs.large.hidden_dim}"
    embed_dim: "${model.configs.large.embed_dim}"
    num_layers: 2
    kernel_size: 3
    dilation: [1, 2]
    dropout: 0.35
  
  # Gated Fusion
  fusion:
    strategy: "gated"
    description: "Learned gates dynamically weight modality contributions"
    # g = sigmoid(W_g [e_m; e_l; e_t] + b_g)
    # e_fused = g_m * e_m + g_l * e_l + g_t * e_t
  
  # Cross-Service Attention
  attention:
    num_layers: 2
    num_heads: 4
    dropout: 0.35
    causal_injection: true
    causal_weight: 0.3  # λ for PCMCI attention bias
  
  # Causal Discovery
  causal:
    method: "pcmci"
    tau_max: 3  # Maximum time lag (45 seconds at 15s sampling)
    alpha_level: 0.05
    independence_test: "parcorr"
    cache_enabled: true
    cache_path: "outputs/causal_cache_multimodal.pkl"

# Training Configuration
training:
  optimizer: "adamw"
  learning_rate: 0.001
  weight_decay: 0.01
  batch_size: 8
  epochs: 100
  early_stopping_patience: 20
  
  # Gradient
  clip_grad: 1.0
  
  # Scheduler
  scheduler: "cosine_annealing_warm_restarts"
  t0: 10
  t_mult: 2
  
  # Loss
  loss:
    type: "cross_entropy_with_ranking"
    label_smoothing: 0.1
    rank_weight: 0.3
    margin: 0.5
  
  # Regularization
  dropout: 0.35

# Data Configuration
data:
  dataset: "RCAEval RE2"
  systems:
    - name: "OnlineBoutique"
      cases: 47
    - name: "SockShop"
      cases: 53
    - name: "TrainTicket"
      cases: 81
  total_cases: 181
  
  split:
    train: 0.70  # 127 cases
    val: 0.15    # 27 cases
    test: 0.15   # 27 cases
  
  features:
    metrics:
      timesteps: 60
      features_per_service: 64
    logs:
      timesteps: 60
      features_per_service: 32  # Log template counts
    traces:
      timesteps: 60
      features_per_service: 32  # 16 latency + 16 error features
  
  n_services: 10

# Device
device: "cuda"  # or "cpu"

# Random seeds used in evaluation
seeds: [42, 123, 456, 789, 2024]
